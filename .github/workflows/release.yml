name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check control version matches tag
        run: |
          version=$(sed -n 's/^Version:[[:space:]]*//p' control)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::control Version $version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Install build tools
        run: brew install ldid make xz

      # Upstream Theos builds rootful and rootless; roothide needs the roothide fork
      - name: Install Theos
        run: |
          git clone --quiet --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          git clone --quiet --recursive --depth 1 https://github.com/roothide/theos.git "$RUNNER_TEMP/theos-roothide"
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          git -C "$RUNNER_TEMP/sdks" sparse-checkout set iPhoneOS16.5.sdk
          cp -R "$RUNNER_TEMP/sdks/iPhoneOS16.5.sdk" "$RUNNER_TEMP/theos/sdks/"
          cp -R "$RUNNER_TEMP/sdks/iPhoneOS16.5.sdk" "$RUNNER_TEMP/theos-roothide/sdks/"

      - name: Build
        run: |
          THEOS="$RUNNER_TEMP/theos" gmake clean package FINALPACKAGE=1
          THEOS="$RUNNER_TEMP/theos" gmake clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          THEOS="$RUNNER_TEMP/theos-roothide" gmake clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          ls -l packages

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" packages/*.deb --title "$GITHUB_REF_NAME" --generate-notes

      # Without the token the repo still picks the release up on its nightly build
      - name: Rebuild repo
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "REPO_DISPATCH_TOKEN not set, skipping"
            exit 0
          fi
          gh api repos/tibi1220/repo/dispatches -f event_type=new-release
